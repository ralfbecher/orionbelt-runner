name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # A pinned SHA is unreadable, so no human reviewer will notice one that stops
  # matching the version comment beside it. This catches a pull request that
  # swaps in a commit from a fork while leaving the comment untouched, which is
  # otherwise indistinguishable from a routine Dependabot bump.
  #
  # It gates every other job rather than running beside them. A job that starts
  # in parallel has already executed its own `uses:` before this one can fail,
  # which for a forged pin means the attacker's code ran anyway; the check would
  # then only be blocking the merge, not the run. It costs one job's startup on
  # the critical path, which is worth it for a repository whose CI finishes in
  # under a minute.
  #
  # NOTE: `pins` must stay in branch protection's required contexts. Jobs that
  # `needs:` a failed job are reported as skipped, and branch protection counts
  # a skipped required check as satisfied — so if this job could fail while
  # unrequired, `check`, `test` and `image` would all skip into a green merge.
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify every Action is pinned to its named release
        run: ./scripts/check-action-pins.sh

  # Static analysis doesn't vary by interpreter — run it once on the floor
  # version from requires-python.
  check:
    needs: pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # --locked fails if uv.lock has drifted from pyproject.toml, so a
      # dependency edit without a re-lock is caught here rather than at build.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/ scripts/

      - name: Format check (ruff)
        run: uv run ruff format --check src/ tests/ scripts/

      - name: Type check (mypy)
        run: uv run mypy src/ scripts/

      # Third-party attribution. The `dev` extra installs the whole redistributed
      # closure (it pulls pyarrow and weasyprint), so this reads the same license
      # files the Docker image ships. Fails on two things: THIRD_PARTY_NOTICES.md
      # drifting from uv.lock, and a dependency arriving under a copyleft or
      # unrecognised license that nobody has signed off on. --no-sync so the check
      # sees exactly the environment installed above.
      - name: Third-party licenses (notices + policy)
        run: uv run --no-sync python scripts/third_party_notices.py --check

  # Both ends of the supported range: 3.12 is the floor in requires-python,
  # 3.14 is what the Docker image ships. Keep the top of this matrix in step
  # with the Dockerfile base image so base-image bumps verify themselves.
  test:
    needs: pins
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python }}

      # test_report_pdf.py skips itself when WeasyPrint cannot render, so
      # without these the PDF suite quietly contributes nothing on the runner.
      - name: Install PDF system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core

      # -rs prints why anything skipped: a suite that silently stops covering
      # something is the failure mode this whole step exists to prevent.
      - name: Test (pytest)
        run: uv run --frozen --python ${{ matrix.python }} pytest -rs

  # Build the image on every PR so Dockerfile and base-image changes are
  # exercised here rather than first at release time. Never pushes — the
  # publish workflow remains the only thing that writes to Docker Hub.
  #
  # This covers setup-buildx-action and build-push-action. login-action needs
  # secrets (unavailable to fork PRs), and metadata-action's semver tags need a
  # tag ref, so both stay release-only by nature.
  image:
    needs: pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: orionbelt-runner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the entrypoint resolves and every runtime dep imports under the
      # base image's interpreter — a build alone won't catch that.
      - name: Smoke test
        run: |
          docker run --rm orionbelt-runner:ci version
          docker run --rm --entrypoint python orionbelt-runner:ci -c \
            "import pydantic, httpx, ruamel.yaml, typer, structlog, markdown, orionbelt_runner"

      # PDF is the one output whose correctness lives in the Dockerfile rather
      # than the code: it needs Pango and a font, neither of which is a wheel.
      # An import check would pass with both missing, so this renders a real
      # report through render_pdf and asserts a font was embedded. The unit
      # tests cannot stand in for it — they skip themselves when WeasyPrint
      # cannot render, which is the exact condition this must fail on.
      - name: PDF renders inside the image
        run: |
          docker run --rm -v "$PWD/tests:/smoke:ro" \
            --entrypoint python orionbelt-runner:ci /smoke/smoke_pdf_in_image.py
