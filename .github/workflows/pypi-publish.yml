name: Publish to PyPI

# Publishes the package to PyPI on every version tag (v*.*.*), using PyPI
# Trusted Publishing (OIDC) — no API token is stored. workflow_dispatch is
# also enabled so an existing tag can be backfilled (run against that tag's ref;
# for a tag cut before this workflow existed, run against main instead).
#
# Setup, once: PyPI → orionbelt-runner → Settings → Publishing → add a GitHub
# publisher (owner ralforion, repo orionbelt-runner, workflow pypi-publish.yml,
# environment pypi), plus a GitHub environment named `pypi` under
# Settings → Environments. The two names have to match or the upload is refused.
# PyPI matches on the workflow file and the environment, not on the job, so the
# build/publish split below leaves that binding untouched.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # No id-token here. Everything that runs repository code or third-party
  # tooling happens in this job: `uv build` invokes the build backend, which
  # resolves and executes whatever pyproject names. An identity good for
  # uploading orionbelt-runner to PyPI must not be reachable from any of that,
  # so it is not granted in the job where any of it runs.
  build:
    runs-on: ubuntu-latest
    # Only run for version tags or a manual dispatch.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # First, before any other action runs. Ordering is the point: an action
      # that has already executed could have rewritten the workspace, this
      # script included, so a verifier placed after it would be checking
      # whatever that action left behind. Only checkout runs first, and it has
      # to, since nothing can be verified before the tree it fetches exists.
      # It covers publish's actions too, which is why that job needs no copy:
      # publish cannot start until this job has passed.
      - name: Verify every Action is pinned to its named release
        run: ./scripts/check-action-pins.sh

      # uv rather than pip + build: it is what CI and the Dockerfile already
      # use, and `uv build` produces the same sdist and wheel.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # A tag has to agree with what it packages. The drift has already happened
      # here in the other direction — 0.9.0 sat in pyproject through several
      # commits with no tag behind it — and a tag naming a version it did not
      # build is worse than a missing one.
      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          dunder=$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/orionbelt_runner/__init__.py').read()).group(1))")
          echo "tag=$tag  pyproject=$project  __version__=$dunder"
          if [ "$tag" != "$project" ]; then
            echo "::error::tag v$tag does not match pyproject version $project"
            exit 1
          fi
          if [ "$tag" != "$dunder" ]; then
            echo "::error::tag v$tag does not match __version__ $dunder"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      # --strict also fails on a README PyPI would refuse to render, which is
      # otherwise discovered after the upload, when the version is already spent.
      - name: Check artifacts
        run: uv run --with twine --no-project twine check --strict dist/*

      - name: Upload the distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # The only job that can mint an OIDC token, and it runs no repository code at
  # all: it checks out nothing, installs nothing, and its two steps are the
  # download and the upload. The distributions it publishes were built and
  # checked by `build`, in a job that had no identity to give away.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/orionbelt-runner/
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - name: Collect the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
