name: Publish to PyPI

# Publishes the package to PyPI on every version tag (v*.*.*), using PyPI
# Trusted Publishing (OIDC) — no API token is stored. workflow_dispatch is
# also enabled so an existing tag can be backfilled (run against that tag's ref;
# for a tag cut before this workflow existed, run against main instead).
#
# Setup, once: PyPI → orionbelt-runner → Settings → Publishing → add a GitHub
# publisher (owner ralforion, repo orionbelt-runner, workflow pypi-publish.yml,
# environment pypi), plus a GitHub environment named `pypi` under
# Settings → Environments. The two names have to match or the upload is refused.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  pypi-publish:
    runs-on: ubuntu-latest
    # Only run for version tags or a manual dispatch.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    environment:
      name: pypi
      url: https://pypi.org/project/orionbelt-runner/
    permissions:
      contents: read # checkout
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v7

      # uv rather than pip + build: it is what CI and the Dockerfile already
      # use, and `uv build` produces the same sdist and wheel.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # A tag has to agree with what it packages. The drift has already happened
      # here in the other direction — 0.9.0 sat in pyproject through several
      # commits with no tag behind it — and a tag naming a version it did not
      # build is worse than a missing one.
      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          dunder=$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/orionbelt_runner/__init__.py').read()).group(1))")
          echo "tag=$tag  pyproject=$project  __version__=$dunder"
          if [ "$tag" != "$project" ]; then
            echo "::error::tag v$tag does not match pyproject version $project"
            exit 1
          fi
          if [ "$tag" != "$dunder" ]; then
            echo "::error::tag v$tag does not match __version__ $dunder"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      # --strict also fails on a README PyPI would refuse to render, which is
      # otherwise discovered after the upload, when the version is already spent.
      - name: Check artifacts
        run: uv run --with twine --no-project twine check --strict dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
