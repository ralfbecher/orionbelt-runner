name: Docker Publish

# Build and push the runner image to Docker Hub, and keep the Hub repo
# overview in sync with README.md.
#
# - image       → only on version tags (v1.2.3): publishes :1.2.3, :1.2, :1, :latest
# - description → on pushes to main and manual runs: syncs README.md to the
#                 Docker Hub overview. This job never builds an image, so no
#                 rolling :main / :edge tags are created.
#
# Requires two repository secrets:
#   DOCKERHUB_USERNAME — Docker Hub account / org
#   DOCKERHUB_TOKEN    — a Docker Hub access token (Account Settings → Security)
#                        with read/write scope (read-only fails the description sync)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/orionbelt-runner

jobs:
  image:
    runs-on: ubuntu-latest
    # Build/push only for released version tags — never for branch or PR pushes.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=OrionBelt Runner
            org.opencontainers.image.description=Run OrionBelt Semantic Layer query batches and emit reports.

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attach an SBOM and max-detail build provenance to the pushed image.
          # The image redistributes a large closure (pyarrow and weasyprint pull
          # most of it), and the SBOM is what lets a consumer enumerate that
          # without unpacking the layers -- from 2027 the CRA expects exactly
          # this. THIRD-PARTY-NOTICES.md answers the licence question and rides
          # along inside the image at /app; the SBOM answers "what is in here",
          # which the notice file deliberately does not.
          #
          # Both are attestation manifests in the pushed index, so a plain
          # `docker pull` by tag is unaffected. They are set here rather than in
          # CI's image job because that job builds with `load: true`, and the
          # docker driver cannot load an index carrying attestations.
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  description:
    runs-on: ubuntu-latest
    # Sync the README to the Hub overview on main pushes, manual runs, and
    # releases. Independent of the image build — no image is produced here.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Sync Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: Run OrionBelt Semantic Layer query batches and emit reports.
          readme-filepath: ./README.md
